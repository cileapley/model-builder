  /* The world's tokens. Contrast noted where text meets a field. */
  :root {
    --paper: #F7F3E8;          /* washi ground */
    --paper-deep: #EFEAD8;     /* the answer sheet */
    --ink: #26251F;            /* sumi ink, 13:1 on paper */
    --ink-soft: #635F54;       /* annotations, 5.3:1 on paper, 4.7:1 on the sheet */
    --rule: #D8D2C0;           /* hairline rules */
    --sheet: #33A64C;          /* kelly sheet, non-text fields only */
    --field: #23803A;          /* kelly deep, 4.6:1 under white text */
    --blue: #2B4EC9;           /* royal ink, 5.5:1 on paper */
    --gold: #C9A227;           /* the active dot */
    --crease: #F6F1E9;         /* fold-white lines on kelly */
    --radius: 5px;
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0; color: var(--ink); background: var(--paper);
    font: 16px/1.55 "Segoe UI", Roboto, "Noto Sans", system-ui, sans-serif;
    position: relative;
  }
  /* Kozo fiber: one quiet texture over the whole ground. */
  body::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    opacity: .09;
    background-image: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27240%27 height=%27240%27%3E%3Cfilter id=%27f%27%3E%3CfeTurbulence type=%27fractalNoise%27 baseFrequency=%27.9%27 numOctaves=%272%27/%3E%3C/filter%3E%3Crect width=%27240%27 height=%27240%27 filter=%27url(%23f)%27/%3E%3C/svg%3E");
  }
  main { position: relative; z-index: 1; max-width: 64rem; margin: 0 auto; padding: 0 1.25rem 3rem; }

  /* ---- The cover band ---- */
  header.band {
    position: relative; z-index: 1;
    background: var(--field);
    background-image: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27420%27 height=%2790%27%3E%3Cpath d=%27M0 90 L210 0 M210 90 L420 0 M105 90 L210 45 M315 45 L420 90%27 stroke=%27%23F6F1E9%27 stroke-width=%27.7%27 opacity=%27.14%27 fill=%27none%27/%3E%3C/svg%3E");
    color: #fff;
  }
  .band-inner {
    max-width: 64rem; margin: 0 auto; padding: .8rem 1.25rem;
    display: flex; align-items: center; gap: .8rem;

  .emblem { flex: none; display: block; }
  .wordmark { font-size: 1rem; font-weight: 700; letter-spacing: .18em; }

  /* ---- Item tabs ---- */
  #picker { display: flex; gap: .6rem; flex-wrap: wrap; margin: 1.4rem 0 1.8rem; }
  #picker a {
    font-size: .78rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    padding: .55rem 1rem; border: 1px solid var(--rule); border-radius: var(--radius);

  #picker a[aria-current="true"]::before {

  h1 {

  h2 {

  h2::after { content: ""; flex: 1; border-top: 1px solid var(--rule); }

  .columns { display: flex; gap: 2.4rem; flex-wrap: wrap; align-items: flex-start; }
  .columns > section { min-width: 19rem; flex: 1.25; }
  .columns > aside { min-width: 17rem; flex: 1; position: sticky; top: 1rem; }

  /* ---- The student model (repair) ---- */
  #broken {

  #broken .b-level { width: 4.6rem; flex: none; color: var(--ink-soft); font-size: .9rem; padding-top: .06rem; }
  #broken .b-arrow { color: var(--ink-soft); font-style: italic; margin: .3rem 0 .3rem 5.2rem; font-size: .9rem; }

  /* ---- Word bank ---- */
  #palette {
    display: flex; flex-wrap: wrap; gap: .55rem;
    border: 1px solid var(--rule); border-radius: var(--radius); padding: .8rem;
  }
  #model-panel {
    border: 1px solid var(--rule); border-radius: var(--radius);
    padding: .9rem 1rem 1.1rem;
  }
  .chip {
    font: inherit; font-size: .95rem; padding: .5rem .8rem;
    border: 1px solid var(--rule); border-radius: var(--radius);
    background: #FDFBF4; color: var(--ink); cursor: pointer;
  }
  .chip:hover { border-color: var(--ink-soft); }
  .chip.selected {
    border-color: var(--blue); outline: 2px solid var(--blue); outline-offset: 0;
    background: #fff;
  }
  .chip:focus-visible { outline: 3px solid var(--blue); outline-offset: 1px; }

  /* ---- The model: numbered rows with a margin column ---- */
  .slot-row { display: flex; align-items: center; gap: .8rem; margin: .35rem 0; }
  .step-no {
    flex: none; width: 2rem; text-align: right;
    font-family: "Alegreya", Georgia, serif; font-weight: 700; font-size: 1.05rem;
    color: var(--blue); font-variant-numeric: tabular-nums;
    display: flex; align-items: center; justify-content: flex-end; gap: .4rem;
  }
  .step-dot { flex: none; }
  .slot-label { flex: none; width: 6.6rem; font-size: .78rem; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
  .slot {
    font: inherit; flex: 1; min-height: 2.9rem; padding: .5rem .85rem;
    border: 1px dashed var(--rule); border-radius: var(--radius);
    background: transparent; color: var(--ink-soft); cursor: pointer; text-align: left;
  }
  .slot.filled {
    border: 1px solid var(--ink-soft); background: #FDFBF4; color: var(--ink);
  }
  @media (prefers-reduced-motion: no-preference) {
    .slot.settled { animation: settle .16s ease-out; }
    @keyframes settle {
      from { transform: translateY(-2px); border-color: var(--gold); }
      to   { transform: none; }
    }
  }
  .slot:focus-visible { outline: 3px solid var(--blue); outline-offset: 1px; }
  .chain-link {
    margin: 0 0 0 2.8rem; padding-left: 4.05rem;
    display: flex; align-items: center; gap: .5rem; height: 1.15rem;
  }
  .chain-link .tick { border-left: 1px solid var(--ink-soft); height: 100%; }
  .chain-link.valley .tick { border-left-style: dashed; }
  .chain-link .rel { font-size: .78rem; font-style: italic; color: var(--ink-soft); }

  .arrow-row { margin: .9rem 0; }
  .arrow-row label, .prose-label { display: block; font-size: .95rem; margin-bottom: .35rem; }
  .arrow-row input, textarea {
    font: inherit; padding: .55rem .7rem; border: 1px solid var(--rule);
    border-radius: var(--radius); background: #FDFBF4; width: 100%; color: var(--ink);
  }
  .arrow-row input:focus-visible, textarea:focus-visible, #output:focus-visible {
    outline: 3px solid var(--blue); outline-offset: 1px;

  textarea { min-height: 5.2rem; resize: vertical; }

  /* ---- Progress ---- */
  #progress-line { font-size: .95rem; margin: 0 0 .5rem; }
  #progress-dots { display: flex; gap: .45rem; margin-bottom: .4rem; }
  #progress-dots svg { display: block; }

  /* ---- The answer sheet ---- */
  #answer-panel {
    border: 1px solid var(--rule); border-radius: var(--radius); background: var(--paper-deep);
    padding: 0; overflow: hidden;
  }
  #answer-head {
    background: var(--field); color: #fff; padding: .5rem .9rem;
    background-image: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27220%27 height=%2748%27%3E%3Cpath d=%27M0 48 L110 0 M110 48 L220 0 M55 48 L110 24 M165 24 L220 48%27 stroke=%27%23F6F1E9%27 stroke-width=%27.7%27 opacity=%27.16%27 fill=%27none%27/%3E%3C/svg%3E");
    font-size: .78rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    display: flex; align-items: center; gap: .5rem;

  #answer-head::before {

  }

  #output {
    white-space: pre-wrap; margin: .6rem .9rem .9rem; padding: .7rem .8rem .9rem;
    border-top: 1px dashed var(--ink-soft);
    font-family: Consolas, "Roboto Mono", ui-monospace, monospace; font-size: .84rem;
    line-height: 1.5; color: var(--ink);
  }
  .buttons { display: flex; gap: .7rem; margin: .9rem 0 0; align-items: center; flex-wrap: wrap; }
  .buttons button {
    font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    padding: .7rem 1.2rem; border-radius: var(--radius); cursor: pointer;
  }
  #copy {
    background: var(--field); color: #fff; border: 1px solid var(--field);
    display: inline-flex; align-items: center; gap: .55rem;
  }
  #copy::before {

    background: var(--gold); flex: none;
  }
  #copy:hover { background: #1D6C31; }
  #reset { background: transparent; color: var(--ink); border: 1px solid var(--ink-soft); }
  #reset:hover { border-color: var(--ink); }
  .buttons button:focus-visible { outline: 3px solid var(--blue); outline-offset: 1px; }
  #copy-note { color: var(--field); font-size: .9rem; }

  @media (max-width: 700px) {
    h1 { font-size: 1.7rem; }
    .slot-label { width: 5.2rem; }
    .columns > aside { position: static; }
    .courseline { display: none; }
  }
</style>
</head>
<body>
<!--
THESIS: A biology model built like an orizuru: one sheet, numbered deliberate
steps, every state recoverable. Refuses the ed-tech quiz card grid and the
gray testing shell alike.
OWN-WORLD: Washi paper ground with kozo-fiber grain; kelly-green sheet fields
carrying fold-white crease lines; royal-blue ink for numerals, labels, and
rules; one gold dot marking the active step; hairline-ruled panels; Alegreya
display over a quiet humanist sans.
STORY: A student recognizes their own worksheet world, places words step by
numbered step, watches the answer sheet fill, and tears it out for Canvas.
FIRST VIEWPORT: Green cover band with crease emblem and wordmark; item tabs;
Alegreya title and directions; word bank and numbered model rows left, the
answer sheet with its perforation rule right.
FORM: Orizuru fold-sequence world (challenger, chosen over assigned candidate
6 of 7); seed key 6fb28f37.
FINISH: unreviewed and undocumented is unfinished; this build ends with the
finish review, the verdict, and DESIGN.md
-->
<header class="band">
  <div class="band-inner">
    <svg class="emblem" width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
      <rect x="2" y="2" width="30" height="30" fill="#33A64C"/>
      <path d="M2 2 L32 32 M32 2 L2 32 M17 2 L17 32 M2 17 L32 17" stroke="#F6F1E9" stroke-width="1" opacity=".85" fill="none"/>
      <rect x="2" y="2" width="30" height="30" fill="none" stroke="#F6F1E9" stroke-width="1.4" opacity=".9"/>
    </svg>
    <span class="wordmark">MODEL BUILDER</span>
    <span class="courseline">LIVING EARTH · HIGHLAND</span>
  </div>
</header>
<main>
  <nav id="picker" aria-label="Choose your question"></nav>
  <div class="columns">
    <section>
      <h1 id="title"></h1>
      <p class="directions" id="directions"></p>
      <div id="broken"></div>
      <h2>Word bank</h2>
      <div id="palette"></div>
      <h2 id="model-heading">Your model</h2>
      <div id="model-panel">
        <div id="scaffold"></div>
        <div id="arrows"></div>
        <label for="prose" id="prose-label" class="prose-label"></label>
        <textarea id="prose"></textarea>
      </div>
    </section>
    <aside>
      <h2>Your progress</h2>
      <p id="progress-line"></p>
      <div id="progress-dots" aria-hidden="true"></div>
      <h2>Your answer</h2>
      <div id="answer-panel">
        <div id="answer-head">Tear-out sheet</div>
        <p id="answer-note">This sheet fills in as you work. When you finish,
          copy it and paste it into the quiz answer box.</p>
        <div id="output"></div>
      </div>
      <div class="buttons">
        <button id="copy">Copy my model</button>
        <button id="reset">Start over</button>
        <span id="copy-note" hidden>Copied. Now paste it into the quiz.</span>
      </div>
    </aside>
  </div>
</main>
<script>
"use strict";

// One config per FRQ. A new item is a new entry here, not new code.
// The palette mixes words that belong with words that do not.
const ITEMS = {
  // The Lesson 06 rehearsal. It builds a model the unit has already taught
  // (Lesson 05's oxygen-to-a-leg-muscle), because the rehearsal's ten minutes
  // are for learning the tool, not the biology -- and because the summative's
  // fr1 was deliberately given an UNTAUGHT function so it measures transfer.
  // Rehearsing fr1 itself would have destroyed that (2026-09-09 grill, Q1-Q2).
  // The tissue decoy is nervous tissue, not epithelial tissue: epithelial
  // tissue is fr1's correct tissue rung, and a word rehearsed as a trap
  // should not be the summative's answer four school days later.
  rehearsal: {
    mode: "build",
    group: "practice",
    functionName: "getting oxygen to a leg muscle",
    title: "Build a model: getting oxygen to a leg muscle",
    directions: "Click a word, then click the box where it belongs. " +
      "Some words do not belong anywhere. Type what moves along each arrow. " +
      "Then answer the last question in your own words.",
    levels: ["cell", "tissue", "organ", "organ system"],
    partnerLabel: "second system",
    // Lesson 04's own circulatory chain. The earlier palette ran red blood
    // cell to blood to blood vessel, which asserts that a vessel is MADE of
    // blood -- the chain link reads "forms" and nothing composes a vessel
    // from blood. An artery is composed of smooth muscle tissue, so this
    // chain obeys the composition rule the criteria demand (2026-09-09).
    palette: ["artery", "blood", "circulatory system", "leaf",
              "muscular system", "neuron", "oxygen", "red blood cell",
              "smooth muscle cell", "smooth muscle tissue", "stomach"],
    twoWay: true,
    prosePrompt: "Why does getting oxygen to a leg muscle need both systems? " +
      "Write one or two sentences.",
    proseKey: "why both"
  },
  fr1: {
    group: "csa",
    mode: "build",
    functionName: "gas exchange",
    title: "Build a model: gas exchange",
    directions: "Click a word, then click the box where it belongs. " +
      "Some words do not belong anywhere. Type what moves along each arrow. " +
      "Then answer the last question in your own words.",
    levels: ["cell", "tissue", "organ", "organ system"],
    partnerLabel: "second system",
    palette: ["alveolar cell", "cardiac muscle tissue", "circulatory system",
              "epithelial tissue", "lung", "mitochondrion", "nerve", "oxygen",
              "red blood cell", "respiratory system", "small intestine"],
    twoWay: true,
    prosePrompt: "Why does gas exchange need both systems? Write one or two sentences.",
    proseKey: "why both"
  },
  fr2: {
    group: "csa",
    mode: "repair",
    functionName: "nutrient uptake",
    title: "Fix a broken model: nutrient uptake",
    directions: "Read the student model below. It has three mistakes. " +
      "Build the model the way it should be. Type what moves along the arrow. " +
      "Then name each mistake in the last box.",
    broken: {
      heading: "The student model",
      rows: [["cell", "a mitochondrion"],
             ["tissue", "epithelial tissue"],
             ["organ", "the small intestine"]],
      arrowText: "then an arrow with no label, drawn to the circulatory system"
    },
    modelHeading: "Your fixed model",
    levels: ["cell", "tissue", "organ", "organ system"],
    partnerLabel: "second system",
    palette: ["circulatory system", "digestive system", "epithelial cell",
              "epithelial tissue", "mitochondrion", "nerve", "nutrients",
              "red blood cell", "respiratory system", "small intestine"],
    twoWay: false,
    prosePrompt: "Name the three mistakes in the student model. Say why each one is a mistake.",
    proseKey: "mistakes"
  }
};

const params = new URLSearchParams(location.search);
// DEFAULT_ITEM is a test-day switch. It reads "rehearsal" while the unit is
// teaching, so a student who opens the bare address lands on the practice model
// rather than on the summative's. Flip it to "fr1" the morning of the CSA --
// item 13 tells students to open the builder without naming a tab.
const DEFAULT_ITEM = "fr1";
const itemKey = ITEMS[params.get("item")] ? params.get("item") : DEFAULT_ITEM;
const item = ITEMS[itemKey];

// One tab per item, so the page needs no hand-typed address arguments.
Object.keys(ITEMS).filter(function (k) {
  return ITEMS[k].group === item.group;
}).forEach(function (k) {
  const a = document.createElement("a");
  a.href = "?item=" + k;
  a.textContent = ITEMS[k].title;
  if (k === itemKey) a.setAttribute("aria-current", "true");
  document.getElementById("picker").appendChild(a);
});

// State: what sits in each slot, which word is picked up.
const slots = item.levels.concat(["partner"]);
const placed = Object.fromEntries(slots.map(function (s) { return [s, null]; }));
let selectedChip = null;
let justPlaced = null;

const el = function (id) { return document.getElementById(id); };
el("title").textContent = item.title;
el("directions").textContent = item.directions;
el("prose-label").textContent = item.prosePrompt;
if (item.modelHeading) el("model-heading").textContent = item.modelHeading;

// Repair mode shows the model being diagnosed, exactly as submitted.
if (item.broken) {
  const box = el("broken");
  box.style.display = "block";
  const h = document.createElement("h2");
  h.textContent = item.broken.heading;
  box.appendChild(h);
  item.broken.rows.forEach(function (r) {
    const row = document.createElement("div");
    row.className = "b-row";
    const lv = document.createElement("span");
    lv.className = "b-level"; lv.textContent = r[0] + ":";
    row.appendChild(lv);
    row.appendChild(document.createTextNode(r[1]));
    box.appendChild(row);
  });
  const ar = document.createElement("div");
  ar.className = "b-arrow"; ar.textContent = item.broken.arrowText;
  box.appendChild(ar);
}

// Shuffle the palette once per load so the bank's order teaches nothing.
const words = item.palette.slice();
for (let i = words.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  const t = words[i]; words[i] = words[j]; words[j] = t;
}

// Small authored marks: hollow (open step), green (done), gold (active).
function dotSVG(kind, size) {
  const s = size || 12;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("width", s); svg.setAttribute("height", s);
  svg.setAttribute("viewBox", "0 0 12 12");
  const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  c.setAttribute("cx", 6); c.setAttribute("cy", 6);
  if (kind === "open") {
    c.setAttribute("r", 4.4); c.setAttribute("fill", "none");
    c.setAttribute("stroke", "#635F54"); c.setAttribute("stroke-width", "1.2");
  } else {
    c.setAttribute("r", 5);
    c.setAttribute("fill", kind === "gold" ? "#C9A227" : "#23803A");
  }
  svg.appendChild(c);
  return svg;
}

function firstEmptySlot() {
  for (const s of slots) if (!placed[s]) return s;
  return null;
}

function render() {
  // Palette: every word not currently placed.
  const pal = el("palette");
  pal.textContent = "";
  const used = Object.values(placed);
  words.forEach(function (w) {
    if (used.indexOf(w) !== -1) return;
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = w;
    if (selectedChip === w) b.classList.add("selected");
    b.addEventListener("click", function () {
      selectedChip = (selectedChip === w) ? null : w;
      render();
    });
    pal.appendChild(b);
  });

  // The model: numbered rows, a dashed link naming each relation,
  // a gold dot on the step to do next.
  const sc = el("scaffold");
  sc.textContent = "";
  const active = firstEmptySlot();
  slots.forEach(function (s, i) {
    if (i > 0) {
      const link = document.createElement("div");
      link.className = "chain-link" + (s === "partner" ? " valley" : "");
      const tick = document.createElement("span"); tick.className = "tick";
      const rel = document.createElement("span"); rel.className = "rel";
      rel.textContent = (s === "partner") ? "works with" : "forms";
      link.appendChild(tick); link.appendChild(rel);
      sc.appendChild(link);
    }
    const row = document.createElement("div");
    row.className = "slot-row";
    const no = document.createElement("div");
    no.className = "step-no";
    const dot = document.createElement("span");
    dot.className = "step-dot";
    dot.appendChild(dotSVG(placed[s] ? "done" : (s === active ? "gold" : "open")));
    no.appendChild(dot);
    no.appendChild(document.createTextNode("0" + (i + 1)));
    const lab = document.createElement("div");
    lab.className = "slot-label";
    lab.textContent = s === "partner" ? item.partnerLabel : s;
    const b = document.createElement("button");
    b.type = "button"; b.className = "slot";
    if (placed[s]) {
      b.classList.add("filled");
      if (justPlaced === s) { b.classList.add("settled"); justPlaced = null; }
      b.textContent = placed[s];
    } else {
      b.textContent = "Place a word";
    }
    b.addEventListener("click", function () {
      if (selectedChip) {            // place the picked-up word here
        placed[s] = selectedChip;
        selectedChip = null;
        justPlaced = s;
      } else if (placed[s]) {        // empty slot back into the bank
        placed[s] = null;
      }
      render();
    });
    row.appendChild(no); row.appendChild(lab); row.appendChild(b);
    sc.appendChild(row);
  });

  // The interaction arrows, named from whatever sits in the system slots.
  // Build items ask both directions; repair items relabel one arrow.
  // Placed names take "the" so the question reads as a sentence, not a diagram.
  const sys = placed["organ system"] ? "the " + placed["organ system"] : "your system";
  const partner = placed["partner"] ? "the " + placed["partner"] : "the second system";
  const arrows = el("arrows");
  if (!arrows.dataset.built) {
    arrows.dataset.built = "1";
    (item.twoWay ? ["a1", "a2"] : ["a1"]).forEach(function (id) {
      const row = document.createElement("div");
      row.className = "arrow-row";
      const lab = document.createElement("label");
      lab.id = id + "-label"; lab.htmlFor = id;
      const inp = document.createElement("input");
      inp.id = id; inp.type = "text";
      inp.addEventListener("input", updateOutput);
      row.appendChild(lab); row.appendChild(inp);
      arrows.appendChild(row);
    });
  }
  if (item.twoWay) {
    el("a1-label").textContent = "What moves from " + sys + " to " + partner + "?";
    el("a2-label").textContent = "What moves from " + partner + " to " + sys + "?";
  } else {
    el("a1-label").textContent =
      "What moves along the arrow from " + sys + " to " + partner + "?";
  }
  updateOutput();
}

function updateOutput() {
  const sys = placed["organ system"] || "(empty)";
  const partner = placed["partner"] || "(empty)";
  const lines = ["[model-builder v1 · " + item.mode + " · " + item.functionName + "]"];
  item.levels.forEach(function (s) {
    lines.push(s + ": " + (placed[s] || "(empty)"));
  });
  lines.push("partner: " + partner);
  lines.push("arrow " + sys + "->" + partner + ": " + (el("a1").value.trim() || "(empty)"));
  if (item.twoWay) {
    lines.push("arrow " + partner + "->" + sys + ": " + (el("a2").value.trim() || "(empty)"));
  }
  lines.push(item.proseKey + ": " + (el("prose").value.trim() || "(empty)"));
  el("output").textContent = lines.join("\n");

  // Progress: placements, then each typed part.
  const parts = [];
  slots.forEach(function (s) { parts.push(!!placed[s]); });
  parts.push(el("a1").value.trim() !== "");
  if (item.twoWay) parts.push(el("a2").value.trim() !== "");
  parts.push(el("prose").value.trim() !== "");
  const done = parts.filter(Boolean).length;
  el("progress-line").textContent = done + " of " + parts.length + " steps done";
  const dots = el("progress-dots");
  dots.textContent = "";
  let goldGiven = false;
  parts.forEach(function (p) {
    let kind = "open";
    if (p) kind = "done";
    else if (!goldGiven) { kind = "gold"; goldGiven = true; }
    dots.appendChild(dotSVG(kind, 14));
  });
}

el("prose").addEventListener("input", updateOutput);

el("copy").addEventListener("click", function () {
  const done = function () {
    el("copy-note").hidden = false;
    setTimeout(function () { el("copy-note").hidden = true; }, 4000);
  };
  // file:// and older Chromebooks may lack the async clipboard; fall back.
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(el("output").textContent).then(done, function () {
      fallbackCopy(); done();
    });
  } else { fallbackCopy(); done(); }
});

function fallbackCopy() {
  const r = document.createRange();
  r.selectNodeContents(el("output"));
  const sel = getSelection();
  sel.removeAllRanges(); sel.addRange(r);
  document.execCommand("copy");
  sel.removeAllRanges();
}

el("reset").addEventListener("click", function () {
  slots.forEach(function (s) { placed[s] = null; });
  selectedChip = null;
  el("a1").value = "";
  if (el("a2")) el("a2").value = "";
  el("prose").value = "";
  render();
});

render();
</script>
</body>
